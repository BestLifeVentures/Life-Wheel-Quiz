<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<script async src="https://www.googletagmanager.com/gtag/js?id=G-VCLTRCWDYG"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-VCLTRCWDYG');

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Life Wheel Quiz - 3 Minute Life Score</title>
    <link rel="stylesheet" href="styles.css?v=3">

</head>
<body>
    <!-- Pre-Quiz Form -->
    <div id="intro-screen" class="screen active">
        <div class="container">
            <h2 class="small-title">3 minute life score for video reference</h2>
            <form id="intro-form">
                <div class="form-group">
                    <label for="blv-id" class="small-label">BLV ID (Optional)</label>
                    <input type="text" id="blv-id" name="blvId" placeholder="Your BLV ID">
                </div>
                <div class="form-group">
                    <label for="first-name">First Name</label>
                    <input type="text" id="first-name" name="firstName" placeholder="Your first name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="your@email.com" required>
                </div>
                <button type="submit" class="primary-button">Get My Score</button>
            </form>
        </div>
    </div>

    <!-- Quiz Screen -->
    <div id="quiz-screen" class="screen">
        <div class="container quiz-container">
            <div class="progress-container">
                <div class="progress-bar">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
            </div>
            <div id="question-content">
                <div class="category-icon" id="category-icon"></div>
                <h3 class="category-title" id="category-title"></h3>
                <p class="instruction">Click/tap your place on the line</p>
                <p class="question-text" id="question-text"></p>

                <div class="slider-container">
                    <div class="slider-wrapper">
                        <input type="range" min="1" max="10" step="0.1" value="5" class="slider" id="answer-slider">
                        <div class="slider-value" id="slider-value">5</div>
                    </div>
                    <div class="slider-labels">
                        <span class="label-left" id="label-left"></span>
                        <span class="label-right" id="label-right"></span>
                    </div>
                </div>

                <div class="button-group">
                    <button class="secondary-button" id="back-button" onclick="goBack()" style="visibility: hidden;">Go Back</button>
                    <button class="primary-button" id="next-button" onclick="nextQuestion()">Next</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Results Screen -->
    <div id="results-screen" class="screen">
        <div class="results-container">
            <h2>Your Life Wheel Score</h2>
            <div id="results-chart-container">
                <canvas id="results-canvas" width="600" height="600"></canvas>
            </div>
            <div class="category-scores" id="category-scores"></div>
            <button class="primary-button" onclick="saveResults()">Save Results</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="quiz.js?v=7"></script>
</body>
</html>
