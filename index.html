<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Wheel Quiz</title>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VCLTRCWDYG"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-VCLTRCWDYG');
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .intro {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            border-left: 4px solid #667eea;
        }

        .question-container {
            display: none;
            animation: fadeIn 0.5s;
        }

        .question-container.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .question {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .category {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            margin-bottom: 15px;
        }

        .rating-scale {
            display: flex;
            justify-content: space-between;
            margin: 30px 0;
            gap: 10px;
        }

        .rating-option {
            flex: 1;
            text-align: center;
        }

        .rating-option input[type="radio"] {
            display: none;
        }

        .rating-option label {
            display: block;
            padding: 20px 10px;
            background: #f0f0f0;
            border: 2px solid #ddd;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        .rating-option input[type="radio"]:checked + label {
            background: #667eea;
            color: white;
            border-color: #667eea;
            transform: scale(1.05);
        }

        .rating-option label:hover {
            background: #e8ebff;
            border-color: #667eea;
        }

        .scale-labels {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            font-size: 0.9em;
            color: #666;
        }

        .buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

        button {
            padding: 15px 40px;
            font-size: 1.1em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .progress {
            background: #e0e0e0;
            height: 8px;
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
            border-radius: 10px;
        }

        .results {
            display: none;
        }

        .results.active {
            display: block;
            animation: fadeIn 0.5s;
        }

        .wheel-container {
            display: flex;
            justify-content: center;
            margin: 40px 0;
        }

        canvas {
            max-width: 100%;
            height: auto;
        }

        .score-breakdown {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .score-item {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }

        .score-item h3 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .score-value {
            font-size: 2em;
            font-weight: bold;
            color: #333;
        }

        .score-bar {
            background: #e0e0e0;
            height: 10px;
            border-radius: 5px;
            margin-top: 10px;
            overflow: hidden;
        }

        .score-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 5px;
            transition: width 0.5s;
        }

        .restart-btn {
            display: block;
            margin: 30px auto 0;
            padding: 15px 60px;
        }

        @media (max-width: 768px) {
            .rating-scale {
                flex-wrap: wrap;
            }

            .rating-option {
                flex-basis: calc(50% - 5px);
            }

            h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Life Wheel Quiz</h1>
        <p class="subtitle">Assess your life balance across 8 key areas</p>

        <div id="intro" class="intro">
            <p><strong>Welcome to the Life Wheel Assessment!</strong></p>
            <p style="margin-top: 10px;">This quiz will help you evaluate your satisfaction across 8 important life categories. Rate each statement from 1 (strongly disagree) to 10 (strongly agree).</p>
            <button class="btn-primary" onclick="startQuiz()" style="margin-top: 20px;">Start Assessment</button>
        </div>

        <div id="quiz" style="display: none;">
            <div class="progress">
                <div class="progress-bar" id="progressBar"></div>
            </div>

            <div id="questionsContainer"></div>

            <div class="buttons">
                <button class="btn-secondary" id="prevBtn" onclick="previousQuestion()" style="display: none;">Previous</button>
                <button class="btn-primary" id="nextBtn" onclick="nextQuestion()" disabled>Next</button>
            </div>
        </div>

        <div id="results" class="results">
            <h2 style="text-align: center; color: #667eea; margin-bottom: 20px;">Your Life Wheel Results</h2>

            <div class="wheel-container">
                <canvas id="lifeWheel" width="400" height="400"></canvas>
            </div>

            <div class="score-breakdown" id="scoreBreakdown"></div>

            <button class="btn-primary restart-btn" onclick="restartQuiz()">Take Quiz Again</button>
        </div>
    </div>

    <script>
        const categories = [
            { name: 'Career & Work', color: '#667eea' },
            { name: 'Finance', color: '#764ba2' },
            { name: 'Health & Fitness', color: '#f093fb' },
            { name: 'Personal Growth', color: '#4facfe' },
            { name: 'Relationships', color: '#43e97b' },
            { name: 'Family', color: '#fa709a' },
            { name: 'Fun & Recreation', color: '#fee140' },
            { name: 'Environment', color: '#30cfd0' }
        ];

        const questions = [
            { category: 0, text: "I am satisfied with my current career path and professional development." },
            { category: 1, text: "I feel financially secure and confident about my financial future." },
            { category: 2, text: "I maintain a healthy lifestyle and take good care of my physical well-being." },
            { category: 3, text: "I regularly invest time in learning and personal development." },
            { category: 4, text: "I have fulfilling relationships with friends and romantic partners." },
            { category: 5, text: "My family relationships are strong and supportive." },
            { category: 6, text: "I make time for hobbies and activities that bring me joy." },
            { category: 7, text: "I am happy with my living environment and surroundings." }
        ];

        let currentQuestion = 0;
        let answers = new Array(questions.length).fill(null);

        function startQuiz() {
            document.getElementById('intro').style.display = 'none';
            document.getElementById('quiz').style.display = 'block';
            renderQuestions();
            showQuestion(0);
        }

        function renderQuestions() {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = questions.map((q, index) => {
                const category = categories[q.category];
                return `
                    <div class="question-container" id="question-${index}">
                        <span class="category">${category.name}</span>
                        <div class="question">${q.text}</div>
                        <div class="scale-labels">
                            <span>Strongly Disagree</span>
                            <span>Strongly Agree</span>
                        </div>
                        <div class="rating-scale">
                            ${Array.from({length: 10}, (_, i) => i + 1).map(value => `
                                <div class="rating-option">
                                    <input type="radio" id="q${index}-r${value}" name="q${index}" value="${value}" onchange="selectAnswer(${index}, ${value})">
                                    <label for="q${index}-r${value}">${value}</label>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function showQuestion(index) {
            document.querySelectorAll('.question-container').forEach(q => q.classList.remove('active'));
            document.getElementById(`question-${index}`).classList.add('active');

            updateProgress();
            updateButtons();

            if (answers[index] !== null) {
                document.getElementById(`q${index}-r${answers[index]}`).checked = true;
            }
        }

        function selectAnswer(questionIndex, value) {
            answers[questionIndex] = value;
            updateButtons();
        }

        function updateButtons() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');

            prevBtn.style.display = currentQuestion > 0 ? 'block' : 'none';
            nextBtn.disabled = answers[currentQuestion] === null;
            nextBtn.textContent = currentQuestion === questions.length - 1 ? 'See Results' : 'Next';
        }

        function updateProgress() {
            const progress = ((currentQuestion + 1) / questions.length) * 100;
            document.getElementById('progressBar').style.width = progress + '%';
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                showQuestion(currentQuestion);
            } else {
                showResults();
            }
        }

        function previousQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                showQuestion(currentQuestion);
            }
        }

        function showResults() {
            document.getElementById('quiz').style.display = 'none';
            document.getElementById('results').classList.add('active');

            const categoryScores = calculateCategoryScores();
            drawLifeWheel(categoryScores);
            displayScoreBreakdown(categoryScores);
        }

        function calculateCategoryScores() {
            const scores = new Array(categories.length).fill(0);
            const counts = new Array(categories.length).fill(0);

            questions.forEach((q, index) => {
                scores[q.category] += answers[index];
                counts[q.category]++;
            });

            return scores.map((score, index) => ({
                name: categories[index].name,
                color: categories[index].color,
                score: counts[index] > 0 ? score / counts[index] : 0
            }));
        }

        function drawLifeWheel(categoryScores) {
            const canvas = document.getElementById('lifeWheel');
            const ctx = canvas.getContext('2d');
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const maxRadius = Math.min(centerX, centerY) - 60;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw concentric circles
            ctx.strokeStyle = '#e0e0e0';
            ctx.lineWidth = 1;
            for (let i = 1; i <= 10; i++) {
                ctx.beginPath();
                ctx.arc(centerX, centerY, (maxRadius / 10) * i, 0, 2 * Math.PI);
                ctx.stroke();
            }

            // Draw category segments
            const anglePerCategory = (2 * Math.PI) / categoryScores.length;

            categoryScores.forEach((category, index) => {
                const startAngle = anglePerCategory * index - Math.PI / 2;
                const endAngle = startAngle + anglePerCategory;
                const radius = (category.score / 10) * maxRadius;

                // Draw filled segment
                ctx.fillStyle = category.color + '80';
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.closePath();
                ctx.fill();

                // Draw segment border
                ctx.strokeStyle = category.color;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.closePath();
                ctx.stroke();

                // Draw radial lines
                ctx.strokeStyle = '#ccc';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                const lineX = centerX + maxRadius * Math.cos(startAngle);
                const lineY = centerY + maxRadius * Math.sin(startAngle);
                ctx.lineTo(lineX, lineY);
                ctx.stroke();
            });
        }

        function displayScoreBreakdown(categoryScores) {
            const container = document.getElementById('scoreBreakdown');
            container.innerHTML = categoryScores.map(category => `
                <div class="score-item">
                    <h3>${category.name}</h3>
                    <div class="score-value">${category.score.toFixed(1)}/10</div>
                    <div class="score-bar">
                        <div class="score-bar-fill" style="width: ${(category.score / 10) * 100}%; background: ${category.color};"></div>
                    </div>
                </div>
            `).join('');
        }

        function restartQuiz() {
            currentQuestion = 0;
            answers = new Array(questions.length).fill(null);
            document.getElementById('results').classList.remove('active');
            document.getElementById('intro').style.display = 'block';
        }
    </script>
</body>
</html>
